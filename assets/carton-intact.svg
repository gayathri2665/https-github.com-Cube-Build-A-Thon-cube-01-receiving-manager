<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbb85"/>
      <stop offset="100%" stop-color="#cfab72"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c59f67"/>
      <stop offset="100%" stop-color="#a88147"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ab844c"/>
      <stop offset="100%" stop-color="#8d6832"/>
    </linearGradient>
    <linearGradient id="tape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecd599" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d6b972" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="390" rx="210" ry="24" fill="#000000" opacity="0.15" filter="blur(6px)"/>

  <!-- Carton Isometric Box Group -->
  <g filter="url(#softShadow)">
    <!-- Top Face -->
    <polygon points="300,90 470,170 300,240 130,170" fill="url(#boxTop)" stroke="#9c783e" stroke-width="1.5"/>
    
    <!-- Left / Front Face -->
    <polygon points="130,170 300,240 300,380 130,305" fill="url(#boxFront)" stroke="#8e6a32" stroke-width="1.5"/>
    
    <!-- Right Face -->
    <polygon points="300,240 470,170 470,305 300,380" fill="url(#boxRight)" stroke="#7d5b27" stroke-width="1.5"/>

    <!-- Sealing Tape along Top Seam -->
    <polygon points="295,92 305,88 305,242 295,238" fill="url(#tape)"/>
    <polygon points="295,238 305,242 305,380 295,380" fill="url(#tape)" opacity="0.8"/>

    <!-- Shipping Label on Front Face -->
    <g transform="translate(165, 230) skewY(22) rotate(-2)">
      <rect x="0" y="0" width="95" height="65" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Label Header -->
      <rect x="4" y="4" width="87" height="10" fill="#1e293b" rx="1"/>
      <text x="8" y="11" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="bold">PRIORITY FREIGHT</text>
      <!-- Barcode simulation -->
      <line x1="8" y1="20" x2="8" y2="40" stroke="#000" stroke-width="2"/>
      <line x1="12" y1="20" x2="12" y2="40" stroke="#000" stroke-width="1"/>
      <line x1="15" y1="20" x2="15" y2="40" stroke="#000" stroke-width="3"/>
      <line x1="21" y1="20" x2="21" y2="40" stroke="#000" stroke-width="1.5"/>
      <line x1="25" y1="20" x2="25" y2="40" stroke="#000" stroke-width="2.5"/>
      <line x1="31" y1="20" x2="31" y2="40" stroke="#000" stroke-width="1"/>
      <line x1="35" y1="20" x2="35" y2="40" stroke="#000" stroke-width="3"/>
      <line x1="41" y1="20" x2="41" y2="40" stroke="#000" stroke-width="1.5"/>
      <line x1="45" y1="20" x2="45" y2="40" stroke="#000" stroke-width="2"/>
      <line x1="50" y1="20" x2="50" y2="40" stroke="#000" stroke-width="1"/>
      <!-- Text details -->
      <text x="8" y="48" fill="#334155" font-family="monospace" font-size="5.5" font-weight="bold">SKU-ELEC-402</text>
      <text x="8" y="56" fill="#64748b" font-family="sans-serif" font-size="4.5">PO-2026-9041 | QTY: 100</text>
      <!-- Small QR code -->
      <rect x="66" y="20" width="22" height="22" fill="#0f172a"/>
      <rect x="70" y="24" width="6" height="6" fill="#fff"/>
      <rect x="78" y="32" width="6" height="6" fill="#fff"/>
    </g>

    <!-- Fragile & Handle with Care Stamps on Right Face -->
    <g transform="translate(350, 230) skewY(-22)">
      <!-- Fragile Glass Icon Stamp -->
      <path d="M 20 15 L 35 15 L 30 35 L 28 35 L 28 45 L 25 45 L 25 35 L 20 35 Z" fill="#b91c1c" opacity="0.75"/>
      <text x="10" y="55" fill="#b91c1c" font-family="sans-serif" font-size="6" font-weight="bold" letter-spacing="1">FRAGILE</text>
      <!-- Up Arrows -->
      <path d="M 60 30 L 68 20 L 76 30 L 72 30 L 72 45 L 64 45 L 64 30 Z" fill="#1e293b" opacity="0.6"/>
    </g>

    <!-- Inspection Tag Badge -->
    <g transform="translate(420, 110)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#15803d" opacity="0.95"/>
      <circle cx="18" cy="17" r="10" fill="#ffffff"/>
      <path d="M 14 17 L 17 20 L 23 13" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">AI VERIFIED</text>
      <text x="36" y="27" fill="#bbf7d0" font-family="sans-serif" font-size="8">Structure Intact (100%)</text>
    </g>
  </g>
</svg>
