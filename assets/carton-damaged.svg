<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dmgBoxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfab72"/>
      <stop offset="100%" stop-color="#b89359"/>
    </linearGradient>
    <linearGradient id="dmgBoxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b89359"/>
      <stop offset="100%" stop-color="#8d6832"/>
    </linearGradient>
    <linearGradient id="dmgBoxRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7238"/>
      <stop offset="100%" stop-color="#735020"/>
    </linearGradient>
    <filter id="dmgShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="390" rx="210" ry="24" fill="#000000" opacity="0.15" filter="blur(6px)"/>

  <!-- Carton Isometric Box Group with Crushed Corner -->
  <g filter="url(#dmgShadow)">
    <!-- Top Face (Buckled) -->
    <polygon points="300,90 470,170 300,240 185,188 155,195 130,170" fill="url(#dmgBoxTop)" stroke="#8e6a32" stroke-width="1.5"/>
    
    <!-- Left / Front Face (Deformed with Crushing on Left Edge) -->
    <polygon points="130,170 155,195 140,245 160,285 130,305 130,380 300,380 300,240" fill="url(#dmgBoxFront)" stroke="#7d5b27" stroke-width="1.5"/>
    
    <!-- Crease / Fold Lines on Damaged Corner -->
    <path d="M 155 195 L 210 250 L 160 285" fill="none" stroke="#5c4117" stroke-width="3" stroke-linecap="round"/>
    <path d="M 140 245 L 180 260" fill="none" stroke="#483311" stroke-width="2"/>
    <polygon points="150,225 175,255 148,265" fill="#3a2709" opacity="0.8"/> <!-- Deep puncture hole -->

    <!-- Right Face -->
    <polygon points="300,240 470,170 470,305 300,380" fill="url(#dmgBoxRight)" stroke="#664619" stroke-width="1.5"/>

    <!-- Torn Tape -->
    <polygon points="295,92 305,88 305,180 295,178" fill="#d6b972" opacity="0.9"/>
    <!-- Split gap in tape -->
    <polygon points="295,200 305,205 305,242 295,238" fill="#d6b972" opacity="0.9"/>

    <!-- Defaced/Creased Shipping Label -->
    <g transform="translate(185, 240) skewY(22) rotate(3)">
      <rect x="0" y="0" width="85" height="55" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <line x1="0" y1="28" x2="85" y2="35" stroke="#cbd5e1" stroke-dasharray="3,3"/>
      <!-- Barcode damaged -->
      <line x1="8" y1="12" x2="8" y2="30" stroke="#000" stroke-width="2"/>
      <line x1="12" y1="12" x2="12" y2="30" stroke="#000" stroke-width="1"/>
      <line x1="15" y1="12" x2="15" y2="22" stroke="#000" stroke-width="3"/>
      <path d="M 18 20 Q 25 35 32 18" stroke="#dc2626" stroke-width="2" fill="none"/> <!-- Scratch -->
      <line x1="35" y1="12" x2="35" y2="30" stroke="#000" stroke-width="3"/>
      <line x1="40" y1="12" x2="40" y2="28" stroke="#000" stroke-width="1.5"/>
      <text x="8" y="42" fill="#334155" font-family="monospace" font-size="5" font-weight="bold">SKU-ELEC-402 (PARTIAL)</text>
      <text x="8" y="49" fill="#dc2626" font-family="sans-serif" font-size="4" font-weight="bold">BARCODE OCCLUDED</text>
    </g>

    <!-- AI Model Bounding Box Annotation (Simulated MobileNetV3 Detection) -->
    <g transform="translate(110, 160)">
      <rect x="0" y="0" width="125" height="150" rx="4" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
      <!-- Target Corner brackets -->
      <path d="M 0 15 L 0 0 L 15 0" stroke="#dc2626" stroke-width="4" fill="none"/>
      <path d="M 110 0 L 125 0 L 125 15" stroke="#dc2626" stroke-width="4" fill="none"/>
      <path d="M 0 135 L 0 150 L 15 150" stroke="#dc2626" stroke-width="4" fill="none"/>
      <path d="M 110 150 L 125 150 L 125 135" stroke="#dc2626" stroke-width="4" fill="none"/>
      <!-- Floating Label -->
      <rect x="0" y="-22" width="150" height="22" rx="3" fill="#dc2626"/>
      <text x="6" y="-7" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">CRUSH_PUNCTURE: 96.4%</text>
    </g>

    <!-- AI Verdict Badge Top Right -->
    <g transform="translate(400, 100)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#dc2626" opacity="0.95"/>
      <circle cx="18" cy="17" r="10" fill="#ffffff"/>
      <path d="M 13 13 L 23 21 M 23 13 L 13 21" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <text x="36" y="15" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">AI DEFECT DETECTED</text>
      <text x="36" y="26" fill="#fecaca" font-family="sans-serif" font-size="8">Structural Failure / Torn</text>
    </g>
  </g>
</svg>
